# 9 人村の役職構成。順番は表示順。
- {role: VILLAGER,  name: 村人,   name_en: Villager,  side: 村人, side_en: Villagers,  count: 3, ability: なし, ability_en: None}
- {role: SEER,      name: 占い師, name_en: Seer,      side: 村人, side_en: Villagers,  count: 1, ability: 夜のターンに1名選択し、そのプレイヤーの陣営を知ることができる, ability_en: "Each night, select one player to learn which team they belong to"}
- {role: MEDIUM,    name: 霊媒師, name_en: Medium,    side: 村人, side_en: Villagers,  count: 1, ability: 投票によって追放されたプレイヤーの陣営を知ることができる, ability_en: "Can learn the team affiliation of the player most recently eliminated by vote"}
- {role: BODYGUARD, name: 騎士,   name_en: Bodyguard, side: 村人, side_en: Villagers,  count: 1, ability: 夜のターンに1名選択し、そのプレイヤーを人狼の襲撃から守ることができる, ability_en: "Each night, select one player to protect from werewolf attack"}
- {role: WEREWOLF,  name: 人狼,   name_en: Werewolf,  side: 人狼, side_en: Werewolves, count: 2, ability: 夜のターンに1名選択し、そのプレイヤーを襲撃することでゲームから除外することができる, ability_en: "Each night, select one player to attack and eliminate from the game"}
- {role: POSSESSED, name: 狂人,   name_en: Possessed, side: 人狼, side_en: Werewolves, count: 1, ability: 人狼陣営の勝利が自身の勝利になる, ability_en: "Wins when the Werewolf team wins"}
